[build-system]
requires      = ["setuptools>=61,<84", "wheel"]  # <74 keeps Metadata-Version 2.3 (PyPI-safe)
build-backend = "setuptools.build_meta"

[project]
name        = "glassbox-mech-interp"
version     = "4.5.1"
description = "Mechanistic interpretability + EU AI Act Annex IV compliance. 21/21 frameworks: ACDC edge-circuit discovery, multi-arch GQA/RMSNorm adapter (Llama-3/Mistral/Phi-3), cross-model comparison, causal scrubbing, DAS, Hessian bounds, BH FDR, folded LayerNorm, SAE polysemanticity, multi-corruption, held-out validation. Dual-licensed (MIT core + BSL 1.1 compliance engine)."
readme      = "README.md"
license     = { text = "MIT AND LicenseRef-BUSL-1.1" }
authors     = [{ name = "Ajay Pravin Mahale", email = "mahale.ajay01@gmail.com" }]
requires-python = ">=3.8"

keywords = [
    "mechanistic-interpretability",
    "transformers",
    "circuits",
    "attribution-patching",
    "edge-attribution-patching",
    "logit-lens",
    "sparse-autoencoders",
    "sae",
    "composition-scores",
    "attention-heads",
    "explainability",
    "XAI",
    "LLM",
    "GPT-2",
    "circuit-discovery",
    "alignment",
    "eu-ai-act",
    "annex-iv",
    "compliance",
    "audit",
    "black-box-audit",
    "regulatory-compliance",
    "causal-scrubbing",
    "distributed-alignment-search",
    "das",
    "hessian",
    "layernorm-correction",
    "false-discovery-rate",
    "benjamini-hochberg",
    "polysemanticity",
    "multi-corruption",
    "held-out-validation",
    "sample-size-gate",
    "interpretability",
    "circuit-faithfulness",
    "acdc",
    "automated-circuit-discovery",
    "grouped-query-attention",
    "gqa",
    "rmsnorm",
    "llama",
    "mistral",
    "cross-model",
    "multi-architecture",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "Typing :: Typed",
]

dependencies = [
    # Upper bounds pin to the verified-compatible stack (Mahale 2026 results).
    # numpy<2 is critical: NumPy 2.0 changed np.bool semantics, which breaks the
    # attribution-stability path. torch<2.11 and transformer_lens<3 keep the
    # hook/cache API stable. Without these ceilings a fresh `pip install` pulls
    # NumPy 2.x + torch nightly and the engine fails (see CI run #3, 2026-06-08).
    "torch>=2.0,<2.11",
    "transformer_lens>=1.0,<3.0",
    "einops>=0.6",
    "numpy>=1.24,<2.0",
    "scipy>=1.9",
]


[project.urls]
Homepage      = "https://repo-ashen-psi.vercel.app"
Dashboard     = "https://huggingface.co/spaces/designer-coderajay/Glassbox-AI-2.0-Mechanistic-Interpretability-tool"
Documentation = "https://github.com/designer-coderajay/Glassbox-AI-2.0-Mechanistic-Interpretability-tool#readme"
Repository    = "https://github.com/designer-coderajay/Glassbox-AI-2.0-Mechanistic-Interpretability-tool"
Paper         = "https://arxiv.org/abs/2603.09988"

[project.optional-dependencies]
sae = [
    "sae-lens>=3.0",
]
compliance = [
    "reportlab>=3.6.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "reportlab>=3.6.0",
]
jupyter = [
    "ipywidgets>=8.0",
    "ipython>=7.0",
]
telemetry = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
hf = [
    "huggingface_hub>=0.20.0",
]
mlflow = [
    "mlflow>=2.10.0",
]
notify = []  # Webhook-based; no extra pip deps needed
all = [
    "sae-lens>=3.0",
    "reportlab>=3.6.0",
    "ipywidgets>=8.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "huggingface_hub>=0.20.0",
    "mlflow>=2.10.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "sae-lens>=3.0",
    "reportlab>=3.6.0",
    "ipywidgets>=8.0",
    "opentelemetry-sdk>=1.20.0",
    "huggingface_hub>=0.20.0",
    "mlflow>=2.10.0",
]
[project.scripts]
glassbox-ai = "glassbox.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
glassbox = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Only collect from tests/ — never from local backups (_local_backups/) or the
# throwaway repro venv (.ci_repro_venv/), which can contain copies of test files
# that collide on module basename.
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow — skip in fast CI with '-m \"not slow\"'",
]
addopts = "--tb=short"

[tool.coverage.run]
source  = ["glassbox"]
omit    = ["glassbox/alignment.py", "glassbox/cli.py"]

[tool.coverage.report]
show_missing   = true
skip_covered   = false
# Honest measured floor (2026-06-09): real coverage is ~62% after the Core ML
# engine test push. Target is 80% as the remaining modules gain tests; raise
# this in step with the CI gate.
fail_under     = 58
exclude_lines  = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.8"
warn_return_any        = true
warn_unused_configs    = true
disallow_untyped_defs  = false
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ruff — linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py38"

[tool.ruff.lint]
# Enforce the rules that catch real bugs and keep the codebase clean:
#   E  — style errors (minus the stylistic ones ignored below)
#   F  — pyflakes: undefined names (caught our F821 NameError), unused imports/vars
#   I  — import ordering
# Dropped:
#   N  — naming; fights standard ML math notation (W_O, W_Q, Δz, layer index `l`)
#   UP — optional type-hint modernization (Dict->dict); cosmetic, not a bug
select = ["E", "F", "I"]
# Stylistic E codes that don't indicate bugs:
#   E501 line length · E701 one-line compound · E731 lambda assign · E741 `l` name
ignore = ["E501", "E701", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports the public API — "unused"/redefined imports are
# intentional (that's how `from glassbox import GlassboxV2` works).
"glassbox/__init__.py" = ["F401", "F811"]
# Optional-dependency import blocks: reportlab (PDF generation) and ipywidgets
# (Jupyter). Imported inside try/except to gate availability — flagged "unused"
# but removing them would break the graceful optional-dep detection.
"glassbox/compliance.py" = ["F401"]
"glassbox/widget.py" = ["F401"]
