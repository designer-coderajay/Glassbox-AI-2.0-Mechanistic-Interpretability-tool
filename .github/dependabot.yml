# Dependabot — automated dependency vulnerability alerts and update PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Tuned for low noise: updates are GROUPED into a single PR per ecosystem
# (instead of one PR per package), and the verified-compatible core deps are
# IGNORED so Dependabot can never loosen the ceilings we pinned on purpose.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    # Never let Dependabot widen these — numpy<2, torch<2.11, transformer_lens<3
    # are the verified stack (NumPy 2.0 breaks the attribution path). Bumped by hand.
    ignore:
      - dependency-name: "numpy"
      - dependency-name: "torch"
      - dependency-name: "transformer_lens"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
