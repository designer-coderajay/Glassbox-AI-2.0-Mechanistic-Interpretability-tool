name: CI

# Tiered pipeline:
#   • lint  — runs on EVERY push and PR. Fast (~30s), no torch. Warn-only for now.
#   • test  — runs on push/PR to main + weekly + manual. Installs the real
#             torch + transformer_lens stack and runs the full suite with coverage.
#
# Why coverage is measured, not gated (yet):
#   We have not yet measured true coverage with the real model installed, so the
#   gate is OFF (--cov-fail-under=0). The run still PRINTS the real % in the log.
#   Once you see a stable green number, set COVERAGE_MIN below to that value
#   (or 80) and flip `--cov-fail-under=0` to `--cov-fail-under=${COVERAGE_MIN}`.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — weekly full run
  workflow_dispatch: {}    # manual "Run workflow" button

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # FAST lane — every push, every branch. No torch, no model download.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff==0.15.16"

      - name: Run ruff
        # BLOCKING. Lint enforces E/F/I — real bugs (undefined names, unused
        # imports/vars), import order, and style errors — while ignoring ML math
        # naming (W_O, W_Q, layer `l`) and optional type-hint modernization.
        # This is the gate that would have caught the F821 NameError from 4.3.1.
        run: ruff check glassbox/

  # ---------------------------------------------------------------------------
  # FULL lane — main pushes/PRs + weekly + manual. Real torch + model.
  # ---------------------------------------------------------------------------
  test:
    name: Test + coverage (full stack)
    runs-on: ubuntu-latest
    # Only pay the heavy cost where it matters, not on every feature-branch push.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace / TransformerLens model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-cache-gpt2-${{ runner.os }}

      - name: Install package + pinned test stack
        # Install the EXACT verified-good versions (the local stack the engine is
        # known to pass on), then install glassbox with --no-deps. This mirrors a
        # known-working environment and eliminates pip-resolution drift: the
        # [dev] extra (sae-lens / mlflow) could otherwise pull an incompatible
        # numpy/torch and defeat the pyproject ceilings.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy==1.26.4" "scipy==1.17.1" "einops==0.8.2" \
            "torch==2.10.0" "transformer-lens==2.17.0" "transformers==4.57.6" \
            pytest pytest-cov reportlab ipywidgets
          pip install -e . --no-deps

      - name: Verify model stack imports (diagnostic)
        # If this fails, transformer_lens/torch did NOT install cleanly and the
        # engine tests can never run — that's the real problem to fix, not a flake.
        # Note: transformer_lens does not expose a top-level __version__, so we
        # check importability and read the version via importlib.metadata.
        run: |
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import transformer_lens; print('transformer_lens import: OK')"
          python -c "import importlib.metadata as m; print('transformer_lens', m.version('transformer-lens'))" || echo "version lookup skipped (non-fatal)"

      - name: Run full suite with coverage (gate at measured floor)
        # Measured real coverage: 71% locally, 932 passed + 2 xfail (2026-06-14)
        # (acdc 95%, das 83%, cross_model 66%, steering 70%, core 98%;
        # explain/notify/bias/telemetry 100%). Gate set to 58% — a buffer below
        # current. Target is 80%; raise as the remaining modules (audit,
        # sae_attribution, hf/mlflow integration) gain tests.
        run: |
          pytest \
            --cov=glassbox \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=58 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # MCP server check — every push. Verifies the MCP server imports, all 5 tools
  # register, and the version string is in sync. Lightweight (no torch).
  # (Folded in from the old Tests workflow, which is now retired.)
  # ---------------------------------------------------------------------------
  mcp-check:
    name: MCP server import + tool registration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MCP server deps (no torch — CPU import check only)
        run: |
          pip install --upgrade pip
          pip install mcp fastmcp pydantic glassbox-mech-interp --quiet

      - name: Verify server imports and all 5 tools register cleanly
        run: |
          python3 - <<'EOF'
          import sys, types

          for mod in ["torch", "transformer_lens", "einops",
                      "fancy_einsum", "jaxtyping"]:
              sys.modules.setdefault(mod, types.ModuleType(mod))

          torch_stub = sys.modules["torch"]
          torch_stub.cuda = types.SimpleNamespace(is_available=lambda: False)
          torch_stub.device = str
          torch_stub.float32 = "float32"

          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location(
              "glassbox_mcp", pathlib.Path("mcp/server.py"))
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          expected = {
              "glassbox_circuit_discovery",
              "glassbox_faithfulness_metrics",
              "glassbox_compliance_report",
              "glassbox_attention_patterns",
              "glassbox_logit_lens",
          }
          registered = {t.name for t in mod.mcp._tool_manager.list_tools()}
          missing = expected - registered
          if missing:
              print(f"FAIL — missing tools: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"OK — {len(registered)} tools registered: {sorted(registered)}")
          EOF

      - name: Verify version string is current
        run: |
          CURRENT=$(python3 -c "
          import re; t=open('pyproject.toml').read()
          print(re.search(r'version\s*=\s*\"([^\"]+)\"', t).group(1))")
          grep -q "glassbox-mech-interp v${CURRENT}" mcp/server.py \
            && echo "OK — mcp/server.py references v${CURRENT}" \
            || (echo "FAIL — mcp/server.py has stale version (expected v${CURRENT})" && exit 1)
